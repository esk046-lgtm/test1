<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파스텔 포모도로 타이머</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'work-bg': '#FDF0ED',
                        'work-accent': '#E07A5F',
                        'work-card': '#F9E2DB',
                        'short-bg': '#EAF4F4',
                        'short-accent': '#6B9080',
                        'short-card': '#CCE3DE',
                        'long-bg': '#F0E6EF',
                        'long-accent': '#9C89B8',
                        'long-card': '#E2ECE9',
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            transition: background-color 0.5s ease;
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Custom scrollbar for task list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body id="app-body" class="bg-work-bg min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 text-slate-700">

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-clock text-2xl" id="logo-icon" style="color: #E07A5F;"></i>
            <h1 class="text-xl font-bold tracking-wide" id="app-title">Pastel Pomodoro</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="sound-toggle-btn" class="p-2.5 rounded-full bg-white/60 hover:bg-white/80 transition shadow-sm text-slate-600" title="소리 켜기/끄기">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="reset-stats-btn" class="p-2.5 rounded-full bg-white/60 hover:bg-white/80 transition shadow-sm text-slate-600" title="오늘의 완료 카운트 초기화">
                <i class="fa-solid fa-rotate-right text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md flex flex-col items-center my-auto space-y-6">

        <!-- Mode Selector Buttons -->
        <div class="flex bg-white/50 backdrop-blur-md p-1.5 rounded-2xl shadow-sm w-full justify-between space-x-1">
            <button id="mode-work" class="flex-1 py-2.5 px-3 rounded-xl font-semibold text-sm transition-all duration-300 shadow-sm bg-white text-slate-800">
                작업 (25분)
            </button>
            <button id="mode-short" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-sm text-slate-600 hover:text-slate-800 transition-all duration-300">
                짧은 휴식 (5분)
            </button>
            <button id="mode-long" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-sm text-slate-600 hover:text-slate-800 transition-all duration-300">
                긴 휴식 (15분)
            </button>
        </div>

        <!-- Timer Circle Container -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-4">
            <!-- SVG Progress Circle -->
            <svg class="w-full h-full" viewBox="0 0 220 220">
                <!-- Background Circle Track -->
                <circle
                    class="text-white/60"
                    stroke-width="12"
                    stroke="currentColor"
                    fill="transparent"
                    r="90"
                    cx="110"
                    cy="110"
                />
                <!-- Progress Indicator Circle -->
                <circle
                    id="progress-circle"
                    class="progress-ring__circle"
                    stroke-width="12"
                    stroke-linecap="round"
                    stroke="#E07A5F"
                    fill="transparent"
                    r="90"
                    cx="110"
                    cy="110"
                />
            </svg>

            <!-- Timer Display Inside Circle -->
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span id="timer-display" class="text-5xl sm:text-6xl font-bold tracking-tight text-slate-800 font-mono">25:00</span>
                <span id="mode-label" class="text-xs uppercase tracking-widest font-bold mt-2 px-3 py-1 rounded-full bg-white/60 text-slate-600">
                    집중 시간
                </span>
            </div>
        </div>

        <!-- Control Buttons (Start, Pause, Skip) -->
        <div class="flex items-center space-x-4">
            <button id="start-pause-btn" class="w-32 py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play text-sm"></i>
                <span id="start-btn-text">시작</span>
            </button>
            <button id="skip-btn" class="p-3.5 bg-white/60 hover:bg-white/90 text-slate-700 rounded-2xl shadow-sm transition transform active:scale-95" title="다음 단계로 스킵">
                <i class="fa-solid fa-forward text-lg"></i>
            </button>
        </div>

        <!-- Today Stats Display -->
        <div class="flex items-center space-x-2 bg-white/40 px-4 py-2 rounded-xl text-sm font-medium text-slate-600">
            <i class="fa-solid fa-check-circle text-amber-500"></i>
            <span>오늘 완료한 포모도로: <strong id="completed-count" class="text-slate-800 font-bold">0</strong>개</span>
        </div>

        <!-- Task List Section -->
        <div class="w-full bg-white/60 backdrop-blur-md rounded-2xl p-4 shadow-sm space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h2 class="font-bold text-slate-700 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-slate-500"></i>
                    <span>오늘의 할 일</span>
                </h2>
                <span id="task-stats" class="text-xs text-slate-500">0개 완료</span>
            </div>

            <!-- Task Input Form -->
            <form id="task-form" class="flex space-x-2">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="할 일을 입력하세요..." 
                    class="flex-1 px-3 py-2 text-sm bg-white/80 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-700"
                    maxlength="40"
                    required
                />
                <button type="submit" class="px-3.5 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl text-sm font-medium transition">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <!-- Task List Scrollable Container -->
            <ul id="task-list" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                <!-- Task Items inserted via JavaScript -->
            </ul>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-6 text-center text-xs text-slate-400 py-2">
        <p>파스텔 포모도로 타이머 &copy; 2026</p>
    </footer>

    <!-- Audio Synthesis & Logic Script -->
    <script>
        // App State
        const MODES = {
            WORK: { name: '작업', time: 25 * 60, color: '#E07A5F', bgClass: 'bg-work-bg', label: '집중 시간' },
            SHORT: { name: '짧은 휴식', time: 5 * 60, color: '#6B9080', bgClass: 'bg-short-bg', label: '짧은 휴식' },
            LONG: { name: '긴 휴식', time: 15 * 60, color: '#9C89B8', bgClass: 'bg-long-bg', label: '긴 휴식' }
        };

        let currentMode = 'WORK';
        let timeLeft = MODES[currentMode].time;
        let timerInterval = null;
        let isRunning = false;
        let completedPomodoros = 0;
        let soundEnabled = true;
        let tasks = [];

        // DOM Elements
        const bodyEl = document.getElementById('app-body');
        const timerDisplay = document.getElementById('timer-display');
        const modeLabel = document.getElementById('mode-label');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startBtnText = document.getElementById('start-btn-text');
        const startBtnIcon = startPauseBtn.querySelector('i');
        const skipBtn = document.getElementById('skip-btn');
        const progressCircle = document.getElementById('progress-circle');
        const logoIcon = document.getElementById('logo-icon');
        const completedCountEl = document.getElementById('completed-count');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const resetStatsBtn = document.getElementById('reset-stats-btn');
        
        const modeWorkBtn = document.getElementById('mode-work');
        const modeShortBtn = document.getElementById('mode-short');
        const modeLongBtn = document.getElementById('mode-long');

        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const taskStats = document.getElementById('task-stats');

        // Circle Setup
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;

        // Sound Effects via Web Audio API
        function playBeepSound() {
            if (!soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // Melodic Notification (Three Tones)
                const tones = [523.25, 659.25, 783.99]; // C5, E5, G5
                tones.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.12);
                    
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + index * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.12 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime + index * 0.12);
                    osc.stop(ctx.currentTime + index * 0.12 + 0.3);
                });
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        // Update Timer Display & Progress Circle
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timeFormatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            timerDisplay.textContent = timeFormatted;
            document.title = `(${timeFormatted}) 파스텔 포모도로`;

            // Progress Circle Calculation
            const totalTime = MODES[currentMode].time;
            const strokeDashoffset = circumference - (timeLeft / totalTime) * circumference;
            progressCircle.style.strokeDashoffset = strokeDashoffset;
        }

        // Set Mode Function
        function setMode(modeKey) {
            pauseTimer();
            currentMode = modeKey;
            timeLeft = MODES[currentMode].time;

            // Update Background Class
            bodyEl.className = `${MODES[currentMode].bgClass} min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 text-slate-700`;

            // Update Progress Color & Logo
            progressCircle.style.stroke = MODES[currentMode].color;
            logoIcon.style.color = MODES[currentMode].color;

            // Update Mode Label
            modeLabel.textContent = MODES[currentMode].label;

            // Update Mode Buttons Active Style
            const activeClass = "shadow-sm bg-white text-slate-800 font-semibold";
            const inactiveClass = "text-slate-600 hover:text-slate-800 font-medium";

            [modeWorkBtn, modeShortBtn, modeLongBtn].forEach(btn => btn.className = `flex-1 py-2.5 px-3 rounded-xl text-sm transition-all duration-300 ${inactiveClass}`);

            if (modeKey === 'WORK') modeWorkBtn.className = `flex-1 py-2.5 px-3 rounded-xl text-sm transition-all duration-300 ${activeClass}`;
            if (modeKey === 'SHORT') modeShortBtn.className = `flex-1 py-2.5 px-3 rounded-xl text-sm transition-all duration-300 ${activeClass}`;
            if (modeKey === 'LONG') modeLongBtn.className = `flex-1 py-2.5 px-3 rounded-xl text-sm transition-all duration-300 ${activeClass}`;

            updateDisplay();
        }

        // Timer Logic
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startBtnText.textContent = '일시정지';
            startBtnIcon.className = 'fa-solid fa-pause text-sm';

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    handleTimerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            startBtnText.textContent = '시작';
            startBtnIcon.className = 'fa-solid fa-play text-sm';
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function handleTimerComplete() {
            pauseTimer();
            playBeepSound();

            if (currentMode === 'WORK') {
                completedPomodoros++;
                completedCountEl.textContent = completedPomodoros;
                // Switch to Short or Long Break automatically
                if (completedPomodoros % 4 === 0) {
                    setMode('LONG');
                } else {
                    setMode('SHORT');
                }
            } else {
                setMode('WORK');
            }
        }

        // Todo List Operations
        function renderTasks() {
            taskList.innerHTML = '';
            let completedNum = 0;

            tasks.forEach((task, index) => {
                if (task.completed) completedNum++;

                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-2.5 rounded-xl bg-white/70 transition ${task.completed ? 'opacity-60' : ''}`;

                li.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden pr-2">
                        <button onclick="toggleTask(${index})" class="text-lg focus:outline-none transition text-slate-400 hover:text-slate-600">
                            <i class="${task.completed ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-regular fa-circle'}"></i>
                        </button>
                        <span class="text-sm font-medium ${task.completed ? 'line-through text-slate-400' : 'text-slate-700'} truncate">
                            ${escapeHtml(task.text)}
                        </span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-slate-400 hover:text-rose-500 transition px-1.5 py-0.5 rounded-lg text-xs">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                taskList.appendChild(li);
            });

            taskStats.textContent = `${completedNum}/${tasks.length}개 완료`;
        }

        function addTask(text) {
            if (!text.trim()) return;
            tasks.push({ text: text.trim(), completed: false });
            taskInput.value = '';
            renderTasks();
        }

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        };

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
        };

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Event Listeners
        startPauseBtn.addEventListener('click', toggleTimer);

        skipBtn.addEventListener('click', () => {
            if (confirm('현재 단계를 건너뛰고 다음 단계로 이동하시겠습니까?')) {
                if (currentMode === 'WORK') {
                    setMode('SHORT');
                } else {
                    setMode('WORK');
                }
            }
        });

        modeWorkBtn.addEventListener('click', () => setMode('WORK'));
        modeShortBtn.addEventListener('click', () => setMode('SHORT'));
        modeLongBtn.addEventListener('click', () => setMode('LONG'));

        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggleBtn.innerHTML = soundEnabled 
                ? '<i class="fa-solid fa-volume-high text-lg"></i>' 
                : '<i class="fa-solid fa-volume-xmark text-lg text-slate-400"></i>';
        });

        resetStatsBtn.addEventListener('click', () => {
            if (confirm('오늘의 완주 카운트를 초기화하시겠습니까?')) {
                completedPomodoros = 0;
                completedCountEl.textContent = 0;
            }
        });

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            addTask(taskInput.value);
        });

        // Initialize App
        setMode('WORK');
    </script>
</body>
</html>
